<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYNORA - Gateway</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style> [x-cloak] { display: none !important; } </style>
</head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-hidden" x-data="synoraGate()">

  <!-- 1. LOADING SCREEN -->
  <div x-show="appState === 'loading'" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
    <div class="w-24 h-24 bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] mb-6 flex items-center justify-center overflow-hidden animate-pulse border border-gray-50">
      <img src="logo.png" onerror="this.style.display='none'" class="w-full h-full object-cover" alt="SYNORA">
    </div>
    <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <!-- 2. LOGIN SCREEN -->
  <div x-show="appState === 'login'" x-cloak class="fixed inset-0 bg-white z-[90] flex flex-col items-center justify-center p-6 overflow-y-auto">
    <!-- (Kode Login persis seperti V1) -->
    <div class="w-full max-w-sm flex flex-col items-center mt-10">
      <h2 class="text-3xl font-extrabold mb-1 text-center text-gray-900 tracking-tight">SYNORA</h2>
      <p class="text-[10px] text-gray-400 mb-8 text-center tracking-widest uppercase font-medium">One Platform. Every Organization.</p>
      
      <div class="flex w-full bg-gray-50 p-1.5 rounded-2xl mb-6 border border-gray-100">
        <button @click="authMode = 'phone'" :class="authMode === 'phone' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500'" class="flex-1 py-3 rounded-xl text-sm font-bold transition">Phone OTP</button>
        <button @click="authMode = 'email'" :class="authMode === 'email' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500'" class="flex-1 py-3 rounded-xl text-sm font-bold transition">Email</button>
      </div>
      
      <!-- Phone Auth -->
      <div x-show="authMode === 'phone'" class="w-full" x-transition>
        <div x-show="!otpSent">
          <input x-model="phoneNumber" type="tel" placeholder="+628123456789" class="w-full px-5 py-4 rounded-xl border outline-none mb-4 text-lg font-medium">
          <div id="recaptcha-container" class="mb-4"></div> 
          <button @click="sendOTP()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-md active:scale-95 transition">Send OTP</button>
        </div>
        <div x-show="otpSent">
          <input x-model="otpCode" type="number" placeholder="6-digit Code" class="w-full px-5 py-4 rounded-xl border outline-none mb-4 text-center tracking-widest text-2xl font-bold">
          <button @click="verifyOTP()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-md active:scale-95 transition">Verify Code</button>
        </div>
      </div>

      <!-- Email Auth -->
      <div x-show="authMode === 'email'" class="w-full" x-cloak x-transition>
        <input x-model="email" type="email" placeholder="Email Address" class="w-full px-5 py-4 rounded-xl border mb-3 outline-none text-lg font-medium">
        <input x-model="password" type="password" placeholder="Password" class="w-full px-5 py-4 rounded-xl border mb-6 outline-none text-lg font-medium">
        <button @click="loginWithEmail()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-md mb-3">Sign In</button>
        <button @click="registerWithEmail()" class="w-full bg-white border border-gray-200 text-gray-700 font-bold py-4 rounded-xl">Create Account</button>
      </div>
    </div>
  </div>

  <!-- 3. MAIN GATE (PILIH ATAU BUAT ORG) -->
  <div x-show="appState === 'main'" x-cloak class="fixed inset-0 bg-gray-50 z-[80] overflow-y-auto pt-10 px-4 pb-10">
    <!-- HEADER DENGAN TOMBOL ADMIN KHUSUS -->
    <div class="flex justify-between items-center mb-6">
       <div>
           <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
           <p class="text-sm text-gray-500" x-text="userName"></p>
       </div>
       <div class="flex items-center gap-2">
           <!-- Tombol Panel Admin (Hanya muncul untuk Super Admin) -->
           <a href="admin.html" x-show="isAdmin" x-cloak class="text-purple-600 bg-purple-50 hover:bg-purple-100 px-3 py-1.5 rounded-lg text-xs font-bold active:scale-95 transition flex items-center gap-1">
               <span>👑</span> Admin Panel
           </a>
           
           <button @click="logout()" class="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg text-xs font-bold active:scale-95 transition">Logout</button>
       </div>
    </div>

    <!-- FITUR JOIN ORGANISASI -->
    <div class="mb-8 bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex gap-2">
        <input x-model="joinOrgId" type="text" placeholder="Masukkan ID (contoh: ORG-123...)" class="flex-1 p-3 rounded-xl border border-gray-200 outline-none focus:border-blue-500 font-medium text-sm bg-gray-50">
        <button @click="joinOrg()" class="bg-gray-800 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-md active:scale-95 transition">Join</button>
    </div>

    <!-- List Organisasi yang sudah diikuti -->
    <h3 class="font-bold text-gray-700 mb-3" x-show="myOrganizations.length > 0">Your Organizations</h3>
    <div x-show="myOrganizations.length > 0" class="mb-8 space-y-3">
       <template x-for="org in myOrganizations" :key="org.id">
         <div class="w-full bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4 transition text-left relative overflow-hidden">
            <!-- Bagian Kiri (Klik untuk masuk) -->
            <div @click="enterOrganization(org.id, org.type)" class="flex-1 flex items-center gap-4 cursor-pointer active:scale-95">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-blue-800 text-white rounded-xl flex items-center justify-center font-bold text-xl" x-text="org.name.charAt(0).toUpperCase()"></div>
                <div>
                  <h4 class="font-bold text-lg text-gray-800" x-text="org.name"></h4>
                  <p class="text-xs text-blue-500 font-bold uppercase" x-text="org.type || 'Family'"></p>
                </div>
            </div>
            
            <!-- Bagian Kanan (Tombol Keluar/Bubar) -->
            <div class="flex items-center gap-2">
                <!-- Tombol Keluar (Hanya untuk Anggota) -->
                <button x-show="!org.isHead" @click="leaveOrg(org.id, org.name)" class="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg text-xs font-bold active:scale-95 transition">
                    Keluar
                </button>
                <!-- Tombol Bubar (Hanya untuk Ketua) -->
                <button x-show="org.isHead" @click="disbandOrg(org.id, org.name)" class="text-red-600 bg-red-100 hover:bg-red-200 px-3 py-2 rounded-lg text-xs font-bold active:scale-95 transition">
                    Bubar
                </button>
                <!-- Panah Navigasi -->
                <div @click="enterOrganization(org.id, org.type)" class="text-gray-300 ml-1 cursor-pointer">➔</div>
            </div>
         </div>
       </template>
    </div>

    <!-- Etalase Bikin Organisasi Baru -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-6">
      <h3 class="font-bold text-xl mb-1">Create New Hub</h3>
      <p class="text-sm text-gray-500 mb-4">Start your own digital ecosystem.</p>
      
      <!-- ETALASE TIER -->
      <div class="space-y-3">
          <template x-for="tier in tiers" :key="tier.id">
             <div @click="selectTier(tier)" class="border border-gray-200 rounded-2xl p-4 flex items-center gap-4 cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition active:scale-95">
                 <div class="text-3xl" x-text="tier.icon"></div>
                 <div class="flex-1">
                     <h4 class="font-bold text-gray-800" x-text="tier.name"></h4>
                     <p class="text-[10px] text-gray-500" x-text="tier.tagline"></p>
                 </div>
                 <div class="text-right">
                     <p class="font-extrabold text-blue-600" x-text="tier.price === 0 ? 'FREE' : 'Rp ' + (tier.price/1000) + 'k'"></p>
                     <p class="text-[9px] text-gray-400 uppercase" x-text="tier.period"></p>
                 </div>
             </div>
          </template>
      </div>
    </div>
  </div>

  <!-- 4. CHECKOUT MODAL (MANUAL WA) -->
  <div x-show="showCheckout" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex flex-col justify-end sm:items-center sm:justify-center">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 pb-10 shadow-2xl transition-transform transform">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">Checkout</h2>
            <button @click="showCheckout = false" class="text-gray-400 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center font-bold">&times;</button>
        </div>
        
        <p class="text-sm text-gray-500 mb-4">You selected: <span class="font-bold text-blue-600" x-text="selectedTier?.name"></span></p>

        <div class="mb-4">
            <label class="text-xs font-bold text-gray-500 mb-1 block">Organization Name</label>
            <input x-model="newOrgName" type="text" :placeholder="selectedTier?.placeholder" class="w-full p-4 rounded-xl border border-gray-200 outline-none focus:border-blue-600 bg-gray-50 font-bold">
        </div>

        <!-- KOLOM KODE PROMO -->
        <div class="mb-4" x-show="selectedTier?.price > 0">
            <label class="text-xs font-bold text-gray-500 mb-1 block">Kode Promo (Opsional)</label>
            <div class="flex gap-2">
                <input x-model="promoInput" type="text" placeholder="Masukkan kode..." class="flex-1 p-3 rounded-xl border border-gray-200 uppercase outline-none bg-gray-50 text-sm font-bold">
                <button @click="applyPromoCode()" class="bg-purple-600 text-white px-4 rounded-xl font-bold text-sm active:scale-95 transition shadow-sm">Klaim</button>
            </div>
            <p x-show="promoMessage" class="text-[10px] mt-1 font-bold" :class="promoValid ? 'text-green-600' : 'text-red-500'" x-text="promoMessage"></p>
        </div>

        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
            <p class="text-xs text-blue-600 font-bold uppercase mb-1">Transfer Amount</p>
            <h3 class="text-3xl font-extrabold text-gray-900 flex items-center gap-2">
                <!-- Tampilkan harga coret jika ada diskon -->
                <span x-show="discountAmount > 0" class="line-through text-gray-400 text-lg font-medium" x-text="'Rp ' + originalTotal.toLocaleString('id-ID')"></span>
                <span x-text="'Rp ' + checkoutTotal.toLocaleString('id-ID')"></span>
            </h3>
            <p class="text-[10px] text-gray-500 mt-1">*Transfer exactly this amount for auto-verification.</p>
        </div>

        <button @click="confirmWhatsAppPayment()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-md flex items-center justify-center gap-2 active:scale-95 transition">
            <span>💬 Confirm via WhatsApp</span>
        </button>
    </div>
  </div>
  <!-- Tambahkan kode ini persis di atas </body> -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((registration) => {
            console.log('Mantap! PWA & Notifikasi siap digunakan.', registration.scope);
          })
          .catch((error) => {
            console.log('Pendaftaran PWA gagal:', error);
          });
      });
    }
  </script>

  <script type="module" src="js/gate.js"></script>
</body>
</html>
